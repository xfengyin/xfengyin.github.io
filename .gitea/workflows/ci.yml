name: CI - Zola build

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Zola build test
    # 只有 NAS runner 配了 github_mirror；落到 1.4G 的 Pi 上连 action 都拉不下来（实测 task 1074 7s 即败）
    runs-on: ${{ github.server_url == 'https://github.com' && 'ubuntu-latest' || 'amd64' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # 原来是一句 `curl -fsSL https://github.com/... | tar xz`：
      # 管道里 curl 失败时 tar 只会报 `unexpected end of file`，看不出根因，
      # 而且**没有任何重试或回退**。2026-10-13 实测因此假红过一次。
      # 现在：多来源依次尝试 + 下载后先校验能否解压 + 失败时明确报错。
      - name: Install Zola
        run: |
          set -euo pipefail
          VER=0.23.4
          FILE=zola-v${VER}-x86_64-unknown-linux-gnu.tar.gz
          GH=https://github.com/getzola/zola/releases/download/v${VER}/${FILE}
          URLS=(
            "https://gh-proxy.com/${GH}"
            "https://ghfast.top/${GH}"
            "${GH}"
          )
          mkdir -p "$HOME/bin" /tmp/zola
          ok=0
          for u in "${URLS[@]}"; do
            echo "尝试下载: $u"
            if curl -fsSL --retry 3 --retry-delay 2 --connect-timeout 15 --max-time 180 -o /tmp/zola/dl.tar.gz "$u"; then
              if tar tzf /tmp/zola/dl.tar.gz >/dev/null 2>&1; then
                tar xzf /tmp/zola/dl.tar.gz -C "$HOME/bin"
                ok=1
                echo "下载成功: $u"
                break
              fi
              echo "  压缩包损坏，换下一个来源"
            else
              echo "  下载失败，换下一个来源"
            fi
          done
          [ "$ok" = "1" ] || { echo "所有来源都拿不到 Zola ${VER}"; exit 1; }
          echo "$HOME/bin" >> "$GITHUB_PATH"
          "$HOME/bin/zola" --version

      - name: Build
        run: |
          zola build
          test -f public/index.html || (echo "public/index.html not found" && exit 1)
          echo "Zola build passed"
