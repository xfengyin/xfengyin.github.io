name: Deploy Zola site to GitHub Pages

# ⚠️ 这个文件必须存在于 .github/workflows/ 下 —— 原因见下。
#
# 2026-10-09 的 d5e3153 把 workflow 从 .github/workflows 迁到了 .gitea/workflows，
# 提交信息写的是「GitHub 侧不再跑 Actions」。但 GitHub Pages 的 build_type 是
# **workflow**：它需要一个 GitHub Actions workflow 来构建并发布。
# 结果：.github/workflows/ 空了之后，**站点再没有任何部署路径** ——
# 推上去的提交不会出现在线上（实测：main 已到 74d2189，线上仍是旧页面、/atom.xml 404）。
#
# 现状（2026-10-26）：.gitea/ 目录已不存在，本仓只有 .github/workflows/pages.yml 一份
# workflow，它在 github.com 上执行 build + deploy —— 没有任何"与 Gitea 分工"这回事了。
# 下面 preflight job 与两处 `if: github.server_url == 'https://github.com'` 是那个双 CI
# 时期的遗留：在 GitHub 上恒为真，不改变行为。清理它们属于行为改动，要在能让 CI 跑一遍的
# 改动里做，别在改注释时顺手改。

on:
  push:
    branches: [main]
  # PR 上也要跑，但要跑的是 build，不是 deploy —— 见 deploy 的 if 守卫。
  # 没有这一步，PR 一次检查都不跑：本仓 54 次运行全部是 event=push。
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 只把 pull_request 摘出去：PR 用「pr-<ref>」自己的组，其余（push 到 main、workflow_dispatch）
# 一律留在 "pages" 组 —— 组名和行为一个字不变，手动部署与 push 部署之间仍然互斥、仍然互相取消。
# 如果 PR 也进 "pages"，一次推 PR 分支就会把正在进行的线上部署取消掉
# （历史实证：39260651862 就是两秒后被同组的下一次运行取消的）。
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: ${{ github.server_url == 'https://github.com' && 'ubuntu-latest' || 'amd64' }}
    steps:
      - name: 说明
        run: echo "GitHub Pages 部署只在 github.com 上执行。"

  build:
    needs: preflight
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Zola
        # 原来是一句 `curl ... | tar xz`：管道里 curl 失败时 tar 只会报
        # "unexpected end of file"，看不出根因，也没有任何重试
        # （同一个形状在本仓曾因下载被截断而假红过一次，这里补上重试与完整性检查）。
        run: |
          set -euo pipefail
          VER=0.23.4
          FILE=zola-v${VER}-x86_64-unknown-linux-gnu.tar.gz
          URL=https://github.com/getzola/zola/releases/download/v${VER}/${FILE}
          mkdir -p "$HOME/bin" /tmp/zola
          curl -fsSL --retry 3 --retry-delay 2 --connect-timeout 15 --max-time 180 -o /tmp/zola/dl.tar.gz "$URL"
          # 解压前先确认这是一个完整的 tar：截断的下载在这里就失败，不会留下半个二进制
          tar tzf /tmp/zola/dl.tar.gz >/dev/null
          tar xzf /tmp/zola/dl.tar.gz -C "$HOME/bin"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          "$HOME/bin/zola" --version

      - name: Build site
        run: zola build

      # Configure Pages 已挪到 deploy（见下方注释）：configure-pages 的 enablement 默认 false，
      # 读不到 Pages 站点时是 core.error + throw（硬失败，不是警告），而「PR 的 token 能不能
      # GET /repos/{owner}/{repo}/pages」从文档和源码都推不出来。build 是这个仓的必需检查，
      # 不能让它依赖一个和构建无关的 Pages API 调用。
      # 它在本仓 outputs 一处未被引用，deploy-pages@v4 的 inputs 也不要求同 job 先跑过它。
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      # ⚠️ 门禁探针：这个 PR 的唯一用途，就是让 build 变红，
      # 证明「必需检查 = build」真的会挡住合并。合并前必须删掉这一步。
      - name: 门禁探针（故意失败）
        run: |
          echo "这是门禁探针，build 必须红。"
          exit 1

  deploy:
    needs: [preflight, build]
    # 三个条件缺一不可：平台是 github.com、事件是 push、ref 正好是 main。
    # 只靠 server_url 会把 PR 分支的内容部署到线上（本文件头注释记着上一次「站点静默不更新」的教训）。
    if: github.server_url == 'https://github.com' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
