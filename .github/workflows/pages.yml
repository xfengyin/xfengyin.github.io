name: Deploy Zola site to GitHub Pages

# ⚠️ 这个文件必须存在于 .github/workflows/ 下 —— 原因见下。
#
# 2026-10-09 的 d5e3153 把 workflow 从 .github/workflows 迁到了 .gitea/workflows，
# 提交信息写的是「GitHub 侧不再跑 Actions」。但 GitHub Pages 的 build_type 是
# **workflow**：它需要一个 GitHub Actions workflow 来构建并发布。
# 结果：.github/workflows/ 空了之后，**站点再没有任何部署路径** ——
# 推上去的提交不会出现在线上（实测：main 已到 74d2189，线上仍是旧页面、/atom.xml 404）。
#
# 因此这里恢复一份 GitHub 侧的 pages workflow。与 .gitea/workflows/pages.yml 的分工：
#   · GitHub 上：这个文件真正执行 build + deploy
#   · Gitea 上：Gitea 读 .gitea/workflows/，本文件里的 job 因 job 级 if 不成立而跳过
#     （Gitea 只对带 needs 的 job 求值 job 级 if，所以保留 preflight 占位）

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: ${{ github.server_url == 'https://github.com' && 'ubuntu-latest' || 'amd64' }}
    steps:
      - name: 说明
        run: echo "GitHub Pages 部署只在 github.com 上执行。"

  build:
    needs: preflight
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Zola
        # 原来是一句 `curl ... | tar xz`：管道里 curl 失败时 tar 只会报
        # "unexpected end of file"，看不出根因，也没有任何重试
        # （Gitea 侧的 ci.yml 已因同一个形状假红过一次，改法见那里的注释；这里补齐同样的加固）。
        run: |
          set -euo pipefail
          VER=0.23.4
          FILE=zola-v${VER}-x86_64-unknown-linux-gnu.tar.gz
          URL=https://github.com/getzola/zola/releases/download/v${VER}/${FILE}
          mkdir -p "$HOME/bin" /tmp/zola
          curl -fsSL --retry 3 --retry-delay 2 --connect-timeout 15 --max-time 180 -o /tmp/zola/dl.tar.gz "$URL"
          # 解压前先确认这是一个完整的 tar：截断的下载在这里就失败，不会留下半个二进制
          tar tzf /tmp/zola/dl.tar.gz >/dev/null
          tar xzf /tmp/zola/dl.tar.gz -C "$HOME/bin"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          "$HOME/bin/zola" --version

      - name: Build site
        run: zola build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: [preflight, build]
    if: github.server_url == 'https://github.com'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
