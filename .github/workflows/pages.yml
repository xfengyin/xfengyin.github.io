name: Deploy Zola site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Gitea 只对带 needs 的 job 求值 job 级 if（见 gitea-flow skill）。
  # 没有这个占位 job，下面的 build/deploy 会在 Gitea 上永久排队。
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: 说明
        run: echo "GitHub Pages 部署只在 github.com 上执行；Gitea 上到此为止。"

  build:
    needs: preflight
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Zola
        run: |
          mkdir -p "$HOME/bin"
          curl -fsSL https://github.com/getzola/zola/releases/download/v0.23.4/zola-v0.23.4-x86_64-unknown-linux-gnu.tar.gz | tar xz -C "$HOME/bin"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Build site
        run: zola build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: [preflight, build]
    if: github.server_url == 'https://github.com'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
