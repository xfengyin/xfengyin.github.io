name: CI - 鍗氬鏋勫缓涓庢祴璇?

on:
  push:
    branches: [main]
    paths:
      - '_posts/**'
      - '_config.yml'
      - 'Gemfile'
      - 'Gemfile.lock'
      - '_layouts/**'
      - '_includes/**'
      - '_sass/**'
      - 'assets/**'
  pull_request:
    branches: [main]
    paths:
      - '_posts/**'
      - '_config.yml'
      - 'Gemfile'
      - 'Gemfile.lock'
      - '_layouts/**'
      - '_includes/**'
      - '_sass/**'
      - 'assets/**'
  workflow_dispatch:  # 鍏佽鎵嬪姩瑙﹀彂

env:
  RUBY_VERSION: '3.2'
  JEKYLL_ENV: 'production'

jobs:
  # 浠ｇ爜璐ㄩ噺妫€鏌?
  lint:
    name: 浠ｇ爜璐ㄩ噺妫€鏌?
    runs-on: ubuntu-latest
    steps:
      - name: 妫€鍑轰唬鐮?
        uses: actions/checkout@v4

      - name: 璁剧疆 Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true

      - name: 瀹夎渚濊禆
        run: bundle install

      - name: 妫€鏌?Ruby 璇硶
        run: |
          find . -name "*.rb" -type f | xargs ruby -c

      - name: 妫€鏌?YAML 璇硶
        run: |
          find . -name "*.yml" -type f | xargs yamllint --no-warnings || true
          find . -name "*.yaml" -type f | xargs yamllint --no-warnings || true

      - name: 妫€鏌?Markdown 閾炬帴
        run: |
          bundle exec htmlproofer ./_site --check-html --disable-external --allow-missing-href --empty-alt-ignore || true

  # 鏋勫缓娴嬭瘯
  build:
    name: 鏋勫缓娴嬭瘯
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: 妫€鍑轰唬鐮?
        uses: actions/checkout@v4

      - name: 璁剧疆 Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true

      - name: 瀹夎渚濊禆
        run: bundle install

      - name: 鏋勫缓缃戠珯
        run: |
          bundle exec jekyll build --trace
          echo "鏋勫缓瀹屾垚锛屾枃浠舵暟閲? $(find _site -type f | wc -l)"

      - name: 妫€鏌ユ瀯寤虹粨鏋?
        run: |
          # 妫€鏌ュ繀瑕佺殑鏂囦欢鏄惁瀛樺湪
          test -f _site/index.html || (echo "index.html 涓嶅瓨鍦? && exit 1)
          test -d _site/assets || (echo "assets 鐩綍涓嶅瓨鍦? && exit 1)
          echo "鉁?鍩烘湰鏂囦欢妫€鏌ラ€氳繃"

      - name: 楠岃瘉 HTML
        run: |
          # 瀹夎 html5validator
          sudo apt-get update
          sudo apt-get install -y html5validator
          
          # 楠岃瘉涓昏椤甸潰
          html5validator --root _site --ignore "*.min.js,*.min.css" --show-warnings || true

      - name: 妫€鏌ユ閾炬帴
        run: |
          bundle exec htmlproofer ./_site \
            --check-html \
            --check-external-hash \
            --disable-external \
            --allow-missing-href \
            --empty-alt-ignore \
            --url-ignore "/#.*/" || true

      - name: 涓婁紶鏋勫缓浜х墿
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: built-site
          path: _site/
          retention-days: 7

  # 娴嬭瘯閮ㄧ讲
  test-deploy:
    name: 娴嬭瘯閮ㄧ讲
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request'
    steps:
      - name: 妫€鍑轰唬鐮?
        uses: actions/checkout@v4

      - name: 璁剧疆 Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true

      - name: 鏋勫缓娴嬭瘯绔欑偣
        run: |
          bundle exec jekyll build --destination _test_site
          echo "娴嬭瘯绔欑偣鏋勫缓瀹屾垚"

      - name: 鍚姩娴嬭瘯鏈嶅姟鍣?
        run: |
          # 鍦ㄥ悗鍙板惎鍔ㄦ祴璇曟湇鍔″櫒
          bundle exec jekyll serve --destination _test_site --port 8080 --host 0.0.0.0 &
          sleep 10  # 绛夊緟鏈嶅姟鍣ㄥ惎鍔?

      - name: 娴嬭瘯璁块棶
        run: |
          curl -f http://localhost:8080/ || (echo "鏃犳硶璁块棶鏈湴鏈嶅姟鍣? && exit 1)
          echo "鉁?娴嬭瘯鏈嶅姟鍣ㄨ闂甯?

  # 鎬ц兘娴嬭瘯
  performance:
    name: 鎬ц兘娴嬭瘯
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: 妫€鍑轰唬鐮?
        uses: actions/checkout@v4

      - name: 璁剧疆 Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true

      - name: 鏋勫缓缃戠珯
        run: bundle exec jekyll build

      - name: 鍒嗘瀽鏋勫缓鎬ц兘
        run: |
          echo "=== 鎬ц兘鍒嗘瀽鎶ュ憡 ==="
          echo "鏋勫缓鏃堕棿缁熻:"
          time bundle exec jekyll build --profile
          
          echo -e "\n鏂囦欢澶у皬缁熻:"
          find _site -type f -name "*.html" | xargs ls -lh | head -10
          
          echo -e "\nCSS/JS 鏂囦欢澶у皬:"
          find _site -type f \( -name "*.css" -o -name "*.js" \) | xargs ls -lh | head -10

      - name: Lighthouse 娴嬭瘯
        uses: treosh/lighthouse-ci-action@v11
        with:
          configPath: './lighthouserc.json'
          uploadArtifacts: true
          temporaryPublicStorage: true

  # 瀹夊叏妫€鏌?
  security:
    name: 瀹夊叏妫€鏌?
    runs-on: ubuntu-latest
    steps:
      - name: 妫€鍑轰唬鐮?
        uses: actions/checkout@v4

      - name: 渚濊禆瀹夊叏妫€鏌?
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true

      - name: 妫€鏌?Gem 渚濊禆瀹夊叏
        run: |
          bundle audit check --update || true

      - name: 妫€鏌ユ晱鎰熶俊鎭?
        run: |
          # 妫€鏌ラ厤缃枃浠朵腑鐨勬晱鎰熶俊鎭?
          if grep -r "password\|secret\|token\|key" _config.yml --ignore-case; then
            echo "鈿狅笍  鍙戠幇鍙兘鐨勬晱鎰熶俊鎭紝璇锋鏌?
          else
            echo "鉁?鏈彂鐜版槑鏄剧殑鏁忔劅淇℃伅"
          fi

      - name: 妫€鏌ユ枃浠舵潈闄?
        run: |
          find . -type f -name "*.sh" -exec ls -la {} \;
          echo "鉁?鏂囦欢鏉冮檺妫€鏌ュ畬鎴?

# 宸ヤ綔娴侀€氱煡

# 缂撳瓨閰嶇疆

