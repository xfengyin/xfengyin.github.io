{% extends "base.html" %}

{% block title %}404 | {{ config.title }}{% endblock %}

{% block content %}
  {# 404 页需要 main landmark（axe: landmark-one-main）。
     顶栏与页脚这次**保留**：旧的 404 把两者都去掉了，于是这一页没有任何导航出口；
     保留后 html.js 与 site.js 都正常加载，不会出现「显示了但点了没反应」的深浅色按钮。 #}
  <main>
    <section class="hero hero--full" aria-label="页面未找到">
      <div class="hero-inner">
        <span class="sig" aria-hidden="true">失</span>
        <h1 class="hero-title">页面未寻得</h1>
        <p class="hero-role">「只在此山中，云深不知处。」</p>
        <p class="hero-back"><a class="back-home" href="/">← 回到首页</a></p>
      </div>
    </section>
  </main>
{% endblock %}
