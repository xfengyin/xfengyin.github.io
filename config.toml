# Zola site configuration
title = "xfengyin"
base_url = "https://xfengyin.github.io/"
description = "xfengyin | AI Systems Engineer / AI Agent Engineer"
# 订阅源的 <feed xml:lang> 与 <entry xml:lang> 取 Zola 的 default_language；
# 不设时默认 en —— 实测生成出来是 xml:lang="en"，对中文站是错的。
default_language = "zh-CN"
# 订阅源的 <author><name> 取 Zola 的顶层 author；原来输出 "Unknown"。
author = "xfengyin"
compile_sass = false
# 压缩 HTML：纯静态站，没有依赖空格的内联内容，收益是实打实的字节数
minify_html = true
# Zola 自带搜索索引（tantivy）**不支持 zh-CN** —— 打开后配 default_language="zh-CN"
# 会直接构建失败（实测：Tried to build search index for language zh-CN which is not supported）。
# 站点本来就用自维护的 static/js/search-data.js，所以这里保持关闭。
build_search_index = false
# 生成 Atom 订阅源：博客的基本盘，原来关着，线上 /atom.xml 是 404
generate_feeds = true
feed_filenames = ["atom.xml"]

taxonomies = [
  { name = "categories", feed = false },
  { name = "tags", feed = false },
]

[markdown]
smart_punctuation = true

[markdown.highlighting]
theme = "github-dark"

[extra]
# feed 里保留的条目数（全文输出，所以用条数控制体积；见 templates/atom.xml）
feed_entries = 10
author = "xfengyin"
role = "AI Systems Engineer / AI Agent Engineer"
site_url = "https://xfengyin.github.io"
github = "https://github.com/xfengyin"
# 源码仓库地址（页脚「托管于 GitHub Pages」应指向它，而不是个人主页）
repo_url = "https://github.com/xfengyin/xfengyin.github.io"
email = "hi@xfengyin.github.io"
avatar = "https://github.com/xfengyin.png"
lang = "zh-CN"
start_year = 2024
# 社交分享用的默认卡片图（贴到微信/X/Telegram 上不再是白板）。
# 用站点已有的封面资源，不新增二进制。
# 站内用（相对路径）：<img src> 之类
og_image = "/assets/img/covers/default-tech.jpg"
# 社交卡片用（**绝对 URL**）：og:image / twitter:image 必须是绝对地址，
# 爬虫不解析相对路径。这两个值分开写，避免在模板里做字符串裁剪 ——
# 实测 Tera 的 replace(count=1) 会把所有斜杠都删掉（不是只删第一个），
# 且本版 Tera 没有 slice / trim_start_matches，子模板顶层也不允许 {% set %}。
og_image_abs = "https://xfengyin.github.io/assets/img/covers/default-tech.jpg"
# 需要时填 X/Twitter 账号（含 @）；留空则只输出 summary_large_image 卡片
twitter_site = ""
