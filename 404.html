<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="https://xfengyin.github.io/css/codex.css" />
  <title>404 | xfengyin</title>
</head>
<body>
  <main class="wrap" style="padding-top: 10px;">
    <div class="terminal">
      <div class="window-bar">
        <div class="dots"><i></i><i></i><i></i></div>
        <span class="file">404.md</span>
        <span class="status">not found</span>
      </div>
      <div class="term-body" style="min-height: 300px;">
        <div class="term-line"><span class="term-prompt"><span class="path">xfengyin@github</span>:~$</span> <span class="t-cmd">cat 404.md</span></div>
        <div class="term-line"><span class="t-red">Error 404: page not found</span></div>
        <div class="term-line"><span class="t-dim">The requested file does not exist in this repository.</span></div>
        <div class="term-line"><span class="t-dim">Try <a href="/">cd ~</a> or <a href="/posts/">cd ~/posts</a>.</span></div>
      </div>
    </div>
  </main>
</body>
</html>
